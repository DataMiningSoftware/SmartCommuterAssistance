name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
      - run: flutter pub get
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > key.properties
      - name: Build signed release AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/debug-info
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=BACKEND_URL=${{ vars.BACKEND_URL }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
      - name: Build debug APK fallback
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: flutter build apk --debug
      - name: Upload build outputs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/debug-info
          if-no-files-found: error

  python:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 backend scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest tests/ -v
