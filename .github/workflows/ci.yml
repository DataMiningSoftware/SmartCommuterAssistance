name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test
        run: flutter test

  python:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 backend scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest tests/ -v
