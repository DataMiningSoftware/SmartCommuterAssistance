name: Deploy Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build web demo
        working-directory: app
        run: flutter build web --release --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY= --dart-define=SENTRY_DSN= --base-href /SmartCommuterAssistance/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
