name: smart_commuter_assistant
description: Smart Commuter Assistant+ - Your intelligent companion for Malaysian public transport

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Material Design
  cupertino_icons: ^1.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  http: ^1.2.2
  geolocator: ^12.0.0
  
  # State Management (uncomment when needed)
  # provider: ^6.0.5
  # riverpod: ^2.4.0
  
  # HTTP & API
  # http: ^1.1.0
  # dio: ^5.3.2
  
  # Local Storage
  # shared_preferences: ^2.2.2
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0
  
  # Notifications
  # flutter_local_notifications: ^16.1.0
  # timezone: ^0.9.2
  
  # Maps & Location
  # google_maps_flutter: ^2.5.0
  # location: ^5.0.3
  # geolocator: ^10.1.0
  
  # Utilities
  # intl: ^0.18.1
  # url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  #   - icons/

  # Fonts (uncomment when adding custom fonts)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F4F7FC"
  image: assets/images/logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#F4F7FC"
    image: assets/images/logo.png
