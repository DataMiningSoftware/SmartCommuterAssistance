app = "smart-commuter-backend"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
