services:
  # ── FastAPI Backend ───────────────────────────────────────────
  - type: web
    name: smart-commuter-backend
    runtime: python
    repo: https://github.com/MuhammadNawfal/SmartCommuterAssistance
    branch: main
    buildCommand: pip install -r "backend/requirements.txt"
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # ── Crowd Forecast Worker (runs every 6h) ────────────────────
  - type: cron
    name: crowd-forecast-worker
    runtime: python
    repo: https://github.com/MuhammadNawfal/SmartCommuterAssistance
    branch: main
    buildCommand: pip install -r "requirements.txt"
    startCommand: python scripts/build_and_upsert_hourly_forecast.py
    schedule: "0 */6 * * *"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # ── Daily Crowd Snapshot (runs at midnight) ──────────────────
  - type: cron
    name: snapshot-daily-blend
    runtime: python
    repo: https://github.com/MuhammadNawfal/SmartCommuterAssistance
    branch: main
    buildCommand: pip install -r "backend/requirements.txt"
    startCommand: cd backend && python snapshot_daily_blend.py
    schedule: "0 0 * * *"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
